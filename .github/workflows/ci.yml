name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit and gateway tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gateway dependencies
        run: if [ -f gateway/requirements.txt ]; then pip install -r gateway/requirements.txt; fi
      - name: Pillow (tests/ccitt.py checks the CCITT decoder against libtiff through it)
        run: pip install pillow
      - name: make test
        run: make test

  atari:
    name: Atari build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The m68k cross compiler
        run: |
          # On 11 Nov 2026 the runners could not reach azure.archive.ubuntu.com or archive.ubuntu.com:
          # kernel.org's mirror, over https (EPlay's finding), and apt retries; on 13 Nov kernel.org was
          # unreachable in turn (EContact): three mirrors, the runner's apt takes the next that answers, IPv4
          # (AERA-Atari fa930c9)
          printf '%s\n' https://mirrors.edge.kernel.org/ubuntu http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y gcc-m68k-linux-gnu
      - name: Build the programs
        run: make
      - name: The build changed no tracked file
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      # no artifact: only formal releases leave the build machine

  # Hatari rigs: enable once the repo's rigs run headless (see EHypView's ci.yml)
